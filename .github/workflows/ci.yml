name: CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Compile placeholders only. They are not a Firebase project and not a
    # fallback in the app. Vercel Production and Preview supply the real values.
    env:
      FIREBASE_API_KEY: ci-not-a-real-key
      FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      FIREBASE_PROJECT_ID: ci-not-production
      FIREBASE_STORAGE_BUCKET: ci.appspot.com
      FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      FIREBASE_APP_ID: "1:000000000000:web:ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          git rev-parse --short HEAD
          node -p "require('./package.json').version"
          node -v
          npm -v
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test
